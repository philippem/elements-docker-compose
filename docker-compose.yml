services:

  bitcoind:
    build: ./bitcoind
    container_name: docker-compose-bitcoind
    volumes:
      - bitcoind-data:/root/.bitcoin/regtest
    ports:
      - "18888:18888"
    networks:
      elements-net:
        ipv4_address: 172.16.238.10

  elementsd-1:
    build: ./elementsd-1
    container_name: docker-compose-elementsd-1
    volumes:
      - elementsd-1-data:/root/.elements/elementsregtest
    ports:
      - "18884:18884"
    networks:
      elements-net:
        ipv4_address: 172.16.238.11
      
      
  elementsd-2:
    build: ./elementsd-2
    container_name: docker-compose-elementsd-2
    volumes:
      - elementsd-2-data:/root/.elements/elementsregtest
    ports:
      - "18886:18886"
    networks:
      elements-net:
        ipv4_address: 172.16.238.12

  elements-esplora:
    build: ./esplora
    environment:
      - "DEBUG=VERBOSE"
      - "NO_REGTEST_MINING=1"
    container_name: docker-compose-elements-esplora
    volumes:
      - elements-esplora-data:/data
    command:
      - liquid-regtest
      - explorer
    ports:
      - "8092:80"      
    networks:
      elements-net:
        ipv4_address: 172.16.238.13

        
      
volumes:
  bitcoind-data:
  elementsd-1-data:
  elementsd-2-data:
  elements-esplora-data:

    
networks:
  elements-net:
    ipam:
     config:
       - subnet: 172.16.238.0/24
